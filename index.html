    <div class="chat-header">
      <span>Messages</span>
      <button class="chat-close" aria-label="Close chat">×</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-form" id="chatForm">
      <input type="text" class="chat-name" id="chatName" placeholder="Your name" autocomplete="off" />
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="7"></textarea>
          <div class="chat-word-count" id="wordCount">0/12</div>
        </div>
        <button type="submit" class="chat-send">Send</button>
      </div>
    </form>
  </div>
