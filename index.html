<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>Iane</title>
</head>
<body>
  <div class="background"></div>

  <section class="section section-home active" data-section="home">
    <div class="txt">Congratulations, you turned every struggle into a step and every dream into a milestone.</div>
  </section>

  <img class="sketch" src="./a-sketch (1).png" alt="" draggable="false" />

  <section class="section section-gallery" data-section="gallery">
    <div class="gallery-grid filter"></div>
  </section>

  <section class="section section-about" data-section="about">
    <div class="about-content">
      <div class="paper" id="paperMessages">
        <div class="paper-lines"></div>
        <div class="paper-content" id="messagesList"></div>
      </div>
    </div>
  </section>

  <nav class="nav-bar" aria-label="Sections">
    <button class="nav-item active" data-value="home">Home</button>
    <button class="nav-item" data-value="gallery">Gallery</button>
  </nav>

   <button class="envelope-btn" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <g class="envelope-flap">
          <path d="M2 6L12 13L22 6" stroke="currentColor" stroke-width="1.5"/>
        </g>
      </svg>
    </button>
    <button class="upload-btn" aria-label="Upload">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 16V4M12 4L8 8M12 4L16 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16H20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="upload-panel" id="uploadPanel">
      <div class="upload-header">
        <span>Upload Picture</span>
        <button class="upload-close" aria-label="Close upload">×</button>
      </div>
        <div class="upload-body">
          <input type="file" id="uploadFileInput" accept="image/*" />
          <div class="upload-file-list" id="uploadFileList"></div>
          <div class="upload-meta">
            <span class="upload-count" id="uploadCount">0/3</span>
            <button class="upload-submit" id="uploadSubmit">Upload</button>
          </div>
        </div>
    </div>
    <div class="chat-panel" id="chatPanel">
     <div class="chat-header">
       <span>Messages</span>
       <button class="chat-close" aria-label="Close chat">×</button>
     </div>
     <div class="chat-messages" id="chatMessages"></div>
     <form class="chat-form" id="chatForm">
        <input type="text" class="chat-name" id="chatName" placeholder="From" autocomplete="off" />
       <div class="chat-input-area">
         <div class="chat-input-wrapper">
           <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="7"></textarea>
           <div class="chat-word-count" id="wordCount">0/3</div>
         </div>
         <button type="submit" class="chat-send">Send</button>
       </div>
     </form>
   </div>

   <div class="congrats-overlay" id="congratsOverlay">
     <div class="congrats-panel">
       <div class="congrats-header">
         <span>Congratulations Messages</span>
         <button class="congrats-close" id="congratsClose" aria-label="Close">×</button>
       </div>
       <div class="congrats-bubbles" id="congratsBubbles"></div>
     </div>
   </div>

    <button class="trashcan" id="trashcan" aria-label="Trash">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 6H21M8 6V4C8 3.44772 8.44772 3 9 3H15C15.5523 3 16 3.44772 16 4V6M19 6V20C19 20.5523 18.5523 21 18 21H6C5.44772 21 5 20.5523 5 20V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
